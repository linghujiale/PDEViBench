[project]
name = "pdevibench"
version = "0.0.1"
description = "PDEViBench: a benchmark of coding agents on partial differential equations that checks how each passing output was computed"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Jiale Linghu" },
    { name = "Yangshuai Wang", email = "yswang@nus.edu.sg" },
]
keywords = [
    "partial-differential-equations",
    "ai-for-science",
    "coding-agents",
    "benchmark",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "sympy==1.13.3",
    "matplotlib==3.9.2",
    "pandas==2.2.3",
    "jsonschema==4.23.0",
    "pyyaml==6.0.2",
    "pydantic==2.13.4",
    "typer==0.12.5",
    "rich==13.9.4",
    "filelock==3.16.1",
    "tqdm==4.66.5",
    "h5py==3.12.1",
    "meshio==5.3.5",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn==1.5.2",
    "statsmodels==0.14.4",
    "pingouin==0.5.5",
]
agents = [
    "anthropic==0.39.0",
    "openai==1.54.4",
    "claude-agent-sdk==0.2.114",
    "httpx==0.27.2",
    "tenacity==9.0.0",
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark*", "agents*", "evaluator*", "analysis*"]
exclude = ["docker*", "paper*", "scripts*", "schemas*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

["tests"]
addopts = "-ra --strict-markers"
